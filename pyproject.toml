[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-home-mcp"
version = "0.1.0"
description = "MCP server for Google Home, Sonos, and Philips Hue device control"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pychromecast>=13.0.0",
    "httpx>=0.27.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.115.0",
    "soco>=0.30.0",
    "phue>=1.1",
]

[project.scripts]
google-home-mcp = "google_home_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_home_mcp"]
